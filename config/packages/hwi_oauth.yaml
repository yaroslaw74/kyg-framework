hwi_oauth:
    # https://github.com/hwi/HWIOAuthBundle/blob/master/docs/2-configuring_resource_owners.md
    resource_owners:
        facebook:
            type: facebook
            client_id: "%env(FACEBOOK_ID)%"
            client_secret: "%env(FACEBOOK_SECRET)%"
            scope: "email public_profile"
            options:
                csrf: true
                display: popup #dialog is optimized for popup window
                auth_type: rerequest # Re-asking for Declined Permissions
        yandex:
            type: yandex
            client_id: "%env(YANDEX_ID)%"
            client_secret: "%env(YANDEX_SECRET)%"
            options:
                csrf: true
        google:
            type: google
            client_id: "%env(GOOGLE_ID)%"
            client_secret: "%env(GOOGLE_SECRET)%"
            scope: "email profile"
            options:
                access_type: offline
                csrf: true
        linkedin:
            type: linkedin
            client_id: "%env(LINKEDIN_ID)%"
            client_secret: "%env(LINKEDIN_SECRET)%"
            scope: "r_liteprofile r_emailaddress"
            options:
                csrf: true
        mailru:
            type: mailru
            client_id: "%env(MAILRU_ID)%"
            client_secret: "%env(MAILRU_SECRET)%"
            options:
                csrf: true
        odnoklassniki:
            type: odnoklassniki
            client_id: "%env(ODNOKLASSNIKI_ID)%"
            client_secret: "%env(ODNOKLASSNIKI_SECRET)%"
            options:
                application_key: "%env(ODNOKLASSNIKI_APPLICATION_KEY)%"
                csrf: true
        xTwitter:
            type: twitter
            client_id: "%env(TWITTER_CONSUMER_KEY)%"
            client_secret: "%env(TWITTER_CONSUMER_SECRET)%"
            options:
                csrf: true
        vkontakte:
            type: vkontakte
            client_id: "%env(VKONTAKTE_ID)%"
            client_secret: "%env(VKONTAKTE_SECRET)%"
            options:
                csrf: true
        github:
            type: github
            client_id: "%env(GITHUB_ID)%"
            client_secret: "%env(GITHUB_SECRET)%"
            scope: "user:email,public_repo"
            options:
                csrf: true
        amazon:
            type: amazon
            client_id: "%env(AMAZON_ID)%"
            client_secret: "%env(AMAZON_SECRET)%"
            scope: "name email"
            options:
                csrf: true
        instagram:
            type: instagram
            client_id: "%env(INSTAGRAM_ID)%"
            client_secret: "%env(INSTAGRAM_SECRET)%"
            options:
                csrf: true
        twitch:
            type: twitch
            client_id: "%env(TWITCH_ID)%"
            client_secret: "%env(TWITCH_SECRET)%"
            options:
                csrf: true
        yahoo:
            type: yahoo
            client_id: "%env(YAHOO_ID)%"
            client_secret: "%env(YAHOO_SECRET)%"
            options:
                csrf: true
        spotify:
            type: spotify
            client_id: "%env(SPOTIFY_ID)%"
            client_secret: "%env(SPOTIFY_SECRET)%)"
            options:
                csrf: true
        trello:
            type: trello
            client_id: "%env(TRELLO_ID)%"
            client_secret: "%env(TRELLO_SECRET)%"
            options:
                csrf: true
                application: "%env(TRELLO_APPLICATION)%"
                scopes: "%env(TRELLO_SCOPES)%"
                expiration: "%env(TRELLO_EXPIRATION)%"
        dropbox:
            type: dropbox
            client_id: "%env(DROPBOX_ID)%"
            client_secret: "%env(DROPBOX_SECRET)%"
            options:
                csrf: true
        flickr:
            type: flickr
            client_id: "%env(FLICKR_ID)%"
            client_secret: "%env(FLICKR_SECRET)%"
            options:
                csrf: true
        windows_live:
            type: windows_live
            client_id: "%env(WINDOWS_LIVE_ID)%"
            client_secret: "%env(WINDOWS_LIVE_SECRET)%"
            scope: wl.signin
            options:
                csrf: true
