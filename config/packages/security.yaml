# yaml-language-server: $schema=../schema.json
security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Modules\Users\Entity\User
                property: username
        sfs_user:
            id: sfs_user.user_provider

    access_decision_manager:
        strategy: unanimous
        allow_if_all_abstain: false

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build|idb|pwa|workbox)/)|^/_ux/inspector\.js$
            security: false

        main:
            lazy: true
            provider: app_user_provider
            pattern: ^/(.*)
            user_checker_on_refresh: true
            oauth:
                resource_owners:
                    facebook: "/login/check-facebook"
                    yandex: "/login/check-yandex"
                    google: "/login/check-google"
                    linkedin: "/login/check-linkedin"
                    mailru: "/login/check-mailru"
                    odnoklassniki: "/login/check-odnoklassniki"
                    x_twitter: "/login/check-x-twitter"
                    vkontakte: "/login/check-vkontakte"
                    github: "/login/check-github"
                    amazon: "/login/check-amazon"
                    instagram: "/login/check-instagram"
                    twitch: "/login/check-twitch"
                    yahoo: "/login/check-yahoo"
                    spotify: "/login/check-spotify"
                    trello: "/login/check-trello"
                    dropbox: "/login/check-dropbox"
                    flickr: "/login/check-flickr"
                    windows_live: "/login/check-windows-live"
                login_path: /login
                use_forward: false
                failure_path: hwi_oauth_connect_registration
                check_path: /login-check

                oauth_user_provider:
                    service: hwi_oauth.user.provider.entity

        admin:
            lazy: true
            provider: sfs_user
            pattern: ^/admin(.*)
            form_login:
                provider: sfs_user
                login_path: sfs_user_login
                check_path: sfs_user_login_check

            login_throttling:
                max_attempts: 5
                interval: "1 minute"

            remember_me:
                secret: "%env(APP_SECRET)%"
                lifetime: 2592000 # 1 month
                secure: true
                httponly: true
                always_remember_me: false

            logout:
                path: sfs_user_logout

            switch_user:
                role: ROLE_ALLOWED_TO_SWITCH
                parameter: _switch_user

        app:
            lazy: true
            provider: app_user_provider
            pattern: ^/app(.*)
            entry_point: "form_login"
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

            logout:
                path: app_logout
                # where to redirect after logout
                target: app

            oauth:
                resource_owners:
                    facebook: "/app/login/check-facebook"
                    yandex: "/app/login/check-yandex"
                    google: "/app/login/check-google"
                    linkedin: "/app/login/check-linkedin"
                    mailru: "/app/login/check-mailru"
                    odnoklassniki: "/app/login/check-odnoklassniki"
                    x_twitter: "/app/login/check-x-twitter"
                    vkontakte: "/app/login/check-vkontakte"
                    github: "/app/login/check-github"
                    amazon: "/app/login/check-amazon"
                    instagram: "/app/login/check-instagram"
                    twitch: "/app/login/check-twitch"
                    yahoo: "/app/login/check-yahoo"
                    spotify: "/app/login/check-spotify"
                    trello: "/app/login/check-trello"
                    dropbox: "/app/login/check-dropbox"
                    flickr: "/app/login/check-flickr"
                    windows_live: "/app/login/check-windows-live"
                login_path: /app/login
                use_forward: false
                failure_path: hwi_oauth_connect_registration
                check_path: /app/login-check

                oauth_user_provider:
                    service: hwi_oauth.user.provider.entity

            remember_me:
                secret: "%env(APP_SECRET)%"
                lifetime: 2629746
                path: app

            login_throttling:
                max_attempts: 5
                interval: "15 minutes"

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_ADMIN_USERS_RW
            - ROLE_ADMIN_INVITATION_RO
            - ROLE_ADMIN_ADMINISTRATORS_RW
            - ROLE_SFS_USER_ADMIN_USERS_RW
            - ROLE_SFS_USER_ADMIN_ADMINISTRATORS_RW
        ROLE_SUPER_ADMIN:
            - ROLE_ADMIN
            - ROLE_ALLOWED_TO_SWITCH
            - ROLE_ADMIN_ADMINISTRATORS_PROMOTE_SUPER
            - ROLE_ADMIN_ADMINISTRATORS_DEMOTE_SUPER
            - PERMISSION_SFS_USER_ADMIN_ADMINISTRATORS_PROMOTE_SUPER
            - PERMISSION_SFS_USER_ADMIN_ADMINISTRATORS_DEMOTE_SUPER

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/.*, role: PUBLIC_ACCESS }
        - { path: ^/connect, roles: PUBLIC_ACCESS }

        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # login page needs to be accessed without credential
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/hwi/login$, role: PUBLIC_ACCESS }
        - { path: ^/logout$, role: PUBLIC_ACCESS }
        - { path: ^/login_check$, role: PUBLIC_ACCESS }
        - { path: ^/request$, role: PUBLIC_ACCESS }
        - { path: ^/check-email$, role: PUBLIC_ACCESS }
        - { path: ^/verify$, role: PUBLIC_ACCESS }
        - { path: ^/reset-password/.*$, role: PUBLIC_ACCESS }

        # App login page needs to be accessed without credential
        - { path: ^/app/login$, role: PUBLIC_ACCESS }
        - { path: ^/app/hwi/login$, role: PUBLIC_ACCESS }
        - { path: ^/app/logout$, role: PUBLIC_ACCESS }
        - { path: ^/app/login_check$, role: PUBLIC_ACCESS }
        - { path: ^/app/request$, role: PUBLIC_ACCESS }
        - { path: ^/app/check-email$, role: PUBLIC_ACCESS }
        - { path: ^/app/verify$, role: PUBLIC_ACCESS }
        - { path: ^/app/reset-password/.*$, role: PUBLIC_ACCESS }

        # CMS login page needs to be accessed without credential
        - { path: ^/admin/login$, role: PUBLIC_ACCESS }
        - { path: ^/admin/logout$, role: PUBLIC_ACCESS }
        - { path: ^/admin/login_check$, role: PUBLIC_ACCESS }
        - { path: ^/admin/request$, role: PUBLIC_ACCESS }
        - { path: ^/admin/check-email$, role: PUBLIC_ACCESS }
        - { path: ^/admin/verify$, role: PUBLIC_ACCESS }
        - { path: ^/admin/reset-password$, role: PUBLIC_ACCESS }
        - { path: ^/admin/invitation$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/register$, roles: PUBLIC_ACCESS }
        #- { path: ^/admin, roles: ROLE_ADMIN }
